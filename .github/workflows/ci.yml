name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- Change these in ONE place if the script moves/renames ---
  BUILD_SCRIPT_REPO: NukuHack/script
  BUILD_SCRIPT_REF: bf3ad979332ec89afa1ed5324d2a702eeb6e3a72 # latest commit at time of editing
  BUILD_SCRIPT_NAME: build
  BUILD_SCRIPT_DIR: shell
  # ------------------------------------------------------------

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch build script
        run: |
          URL="https://raw.githubusercontent.com/${BUILD_SCRIPT_REPO}/${BUILD_SCRIPT_REF}/${BUILD_SCRIPT_DIR}/${BUILD_SCRIPT_NAME}"
          echo "Fetching: $URL"
          curl -fsSL "$URL" -o "/tmp/${BUILD_SCRIPT_NAME}"
          chmod +x "/tmp/${BUILD_SCRIPT_NAME}"

      - name: Run build script
        run: "/tmp/${BUILD_SCRIPT_NAME} --web -y"
        
